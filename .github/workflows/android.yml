name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets
      - run: python -m unittest discover tests -v

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK and run JVM unit tests
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:testDebugUnitTest --console=plain 2>&1 | tee build.log
      - name: Surface compile errors as annotations
        if: failure()
        run: |
          # each annotation carries up to 30 log lines (%0A = newline in workflow commands)
          grep -E "^e: |What went wrong|^> |error:|Could not|FAILED" build.log | head -120 > errors.txt || true
          split -l 30 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Gradle ($f)::$msg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-testbed-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish as the "latest" release (direct phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MeshTestbed.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MeshTestbed.apk \
            --title "Mesh Testbed build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. On each phone: open this page, download MeshTestbed.apk, allow installs from your browser, install." \
            --prerelease
