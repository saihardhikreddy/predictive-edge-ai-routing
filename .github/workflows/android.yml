name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets
      - run: python -m unittest discover tests -v

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee build.log
      - name: Surface compile errors as annotations
        if: failure()
        run: |
          # each annotation carries up to 30 log lines (%0A = newline in workflow commands)
          grep -E "^e: |What went wrong|^> |error:|Could not|FAILED" build.log | head -120 > errors.txt || true
          split -l 30 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Gradle ($f)::$msg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-testbed-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish as the "latest" release (direct phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MeshTestbed.apk
          gh release delete latest --yes --cleanup-tag || true
          sleep 5  # let the old tag deletion settle, or GitHub may create the new release as a draft
          gh release create latest MeshTestbed.apk --target "${{ github.sha }}" \
            --title "Mesh Testbed build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. On each phone: open this page, download MeshTestbed.apk, allow installs from your browser, install." \
            --prerelease
          gh release edit latest --draft=false
          gh release view latest --json isDraft,assets --jq '{draft: .isDraft, assets: [.assets[].name]}'

  virtual-mesh-tests:
    # several virtual phones running the real MeshEngine over a simulated Bluetooth radio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run scenario and unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --console=plain 2>&1 | tee test.log
      - name: Report results as annotations
        if: always()
        run: |
          python3 ci/junit_annotations.py "app/build/test-results/**/*.xml" || true
          if ! ls app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then
            grep -E "^e: |What went wrong|^> |error:|FAILED" test.log | head -30 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=Test build::/'
          fi

  emulator:
    # the real APK on an Android 14 emulator: name card, restart, chapters, crashes
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mesh-testbed-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emulator-smoke.sh
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls emu || exit 0
          gh release delete emulator-test --yes --cleanup-tag || true
          sleep 5
          gh release create emulator-test emu/*.png emu/logcat.txt --target "${{ github.sha }}" \
            --title "Emulator test ${{ github.run_number }}" --notes "Screenshots from the Android 14 emulator run of ${{ github.sha }}." --prerelease || true
          gh release edit emulator-test --draft=false || true
